<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1280" height="440" rx="14" fill="#0f141a"/>
  <rect x="0.5" y="0.5" width="1279" height="439" rx="14" fill="none" stroke="#2a323d"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#f3f4f6">How Speech AI Assistant works</text>
  <text x="40" y="78" font-size="14" fill="#9ca3af">Voice in → text on your GPU → a local LLM summarizes, translates or extracts actions. Nothing leaves your machine.</text>

  <g font-size="15">
    <rect x="40" y="120" width="210" height="150" rx="12" fill="#161c24" stroke="#2a323d"/>
    <rect x="40" y="120" width="210" height="6" rx="3" fill="#38bdf8"/>
    <text x="145" y="158" text-anchor="middle" font-weight="700" fill="#f3f4f6">1 · Record</text>
    <text x="145" y="190" text-anchor="middle" font-size="13" fill="#9ca3af">streamlit-mic-recorder</text>
    <text x="145" y="212" text-anchor="middle" font-size="13" fill="#9ca3af">in-browser microphone</text>
    <text x="145" y="234" text-anchor="middle" font-size="13" fill="#9ca3af">WAV audio bytes</text>

    <rect x="290" y="120" width="210" height="150" rx="12" fill="#161c24" stroke="#166534"/>
    <rect x="290" y="120" width="210" height="6" rx="3" fill="#22c55e"/>
    <text x="395" y="158" text-anchor="middle" font-weight="700" fill="#f3f4f6">2 · Transcribe</text>
    <text x="395" y="190" text-anchor="middle" font-size="13" fill="#9ca3af">faster-whisper "base"</text>
    <text x="395" y="212" text-anchor="middle" font-size="13" fill="#9ca3af">CUDA · float16</text>
    <text x="395" y="234" text-anchor="middle" font-size="13" fill="#9ca3af">beam size 5</text>

    <rect x="540" y="120" width="210" height="150" rx="12" fill="#161c24" stroke="#2a323d"/>
    <rect x="540" y="120" width="210" height="6" rx="3" fill="#a78bfa"/>
    <text x="645" y="158" text-anchor="middle" font-weight="700" fill="#f3f4f6">3 · Choose Task</text>
    <text x="645" y="190" text-anchor="middle" font-size="13" fill="#9ca3af">Summarize · Translate</text>
    <text x="645" y="212" text-anchor="middle" font-size="13" fill="#9ca3af">Extract action items</text>
    <text x="645" y="234" text-anchor="middle" font-size="13" fill="#9ca3af">Fix grammar</text>

    <rect x="790" y="120" width="210" height="150" rx="12" fill="#161c24" stroke="#2a323d"/>
    <rect x="790" y="120" width="210" height="6" rx="3" fill="#f59e0b"/>
    <text x="895" y="158" text-anchor="middle" font-weight="700" fill="#f3f4f6">4 · Process</text>
    <text x="895" y="190" text-anchor="middle" font-size="13" fill="#9ca3af">ChatPromptTemplate</text>
    <text x="895" y="212" text-anchor="middle" font-size="13" fill="#9ca3af">ChatOllama · qwen2.5</text>
    <text x="895" y="234" text-anchor="middle" font-size="13" fill="#9ca3af">temperature 0.3</text>

    <rect x="1040" y="120" width="200" height="150" rx="12" fill="#161c24" stroke="#2a323d"/>
    <rect x="1040" y="120" width="200" height="6" rx="3" fill="#ec4899"/>
    <text x="1140" y="158" text-anchor="middle" font-weight="700" fill="#f3f4f6">5 · Result</text>
    <text x="1140" y="190" text-anchor="middle" font-size="13" fill="#9ca3af">Audio playback</text>
    <text x="1140" y="212" text-anchor="middle" font-size="13" fill="#9ca3af">Transcript</text>
    <text x="1140" y="234" text-anchor="middle" font-size="13" fill="#9ca3af">AI response</text>
  </g>

  <g stroke="#4b5563" stroke-width="2" marker-end="url(#arr)">
    <line x1="252" y1="195" x2="286" y2="195"/>
    <line x1="502" y1="195" x2="536" y2="195"/>
    <line x1="752" y1="195" x2="786" y2="195"/>
    <line x1="1002" y1="195" x2="1036" y2="195"/>
  </g>

  <rect x="40" y="310" width="1200" height="96" rx="12" fill="#121820" stroke="#2a323d" stroke-dasharray="6 6"/>
  <text x="64" y="342" font-size="13" font-weight="700" fill="#9ca3af" letter-spacing="1">LOCAL STACK</text>
  <g font-size="14" font-weight="600">
    <rect x="64"  y="356" width="220" height="34" rx="8" fill="#1e2630"/><text x="174" y="378" text-anchor="middle" fill="#d1d5db">Python 3.11+</text>
    <rect x="300" y="356" width="220" height="34" rx="8" fill="#1e2630"/><text x="410" y="378" text-anchor="middle" fill="#d1d5db">faster-whisper (CTranslate2)</text>
    <rect x="536" y="356" width="220" height="34" rx="8" fill="#1e2630"/><text x="646" y="378" text-anchor="middle" fill="#d1d5db">LangChain + Ollama</text>
    <rect x="772" y="356" width="220" height="34" rx="8" fill="#1e2630"/><text x="882" y="378" text-anchor="middle" fill="#d1d5db">NVIDIA CUDA</text>
    <rect x="1008" y="356" width="208" height="34" rx="8" fill="#1e2630"/><text x="1112" y="378" text-anchor="middle" fill="#d1d5db">Streamlit UI</text>
  </g>
</svg>
