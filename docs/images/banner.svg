<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f141a"/>
      <stop offset="1" stop-color="#14202e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="18" fill="none" stroke="#2a323d"/>

  <!-- microphone -->
  <rect x="96" y="96" width="44" height="76" rx="22" fill="none" stroke="url(#accent)" stroke-width="6"/>
  <path d="M82 148 a36 36 0 0 0 72 0" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <line x1="118" y1="184" x2="118" y2="210" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <line x1="98" y1="212" x2="138" y2="212" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <!-- small wave -->
  <g fill="#38bdf8">
    <rect x="176" y="146" width="6" height="22" rx="3"/>
    <rect x="188" y="134" width="6" height="46" rx="3"/>
    <rect x="200" y="124" width="6" height="66" rx="3"/>
    <rect x="212" y="140" width="6" height="34" rx="3"/>
  </g>
  <path d="M232 157 h28" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M254 147 l12 10 l-12 10" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- text bubble -->
  <rect x="282" y="122" width="96" height="70" rx="12" fill="#161c24" stroke="#2a323d"/>
  <path d="M300 192 l0 18 l18 -18" fill="#161c24" stroke="#2a323d"/>
  <rect x="300" y="190" width="20" height="4" fill="#161c24"/>
  <rect x="298" y="140" width="64" height="6" rx="3" fill="#22c55e"/>
  <rect x="298" y="154" width="50" height="6" rx="3" fill="#38bdf8"/>
  <rect x="298" y="168" width="58" height="6" rx="3" fill="#4b5563"/>

  <text x="420" y="150" font-size="60" font-weight="700" fill="#f3f4f6">Speech <tspan fill="url(#accent)">AI</tspan> Assistant</text>
  <text x="422" y="196" font-size="24" fill="#9ca3af">Speak, transcribe on your GPU, and let a local LLM do the rest</text>

  <g font-size="15" font-weight="600">
    <rect x="422" y="226" width="144" height="32" rx="16" fill="#0f2a1c" stroke="#166534"/>
    <text x="494" y="247" text-anchor="middle" fill="#4ade80">faster-whisper</text>
    <rect x="578" y="226" width="156" height="32" rx="16" fill="#0c2233" stroke="#075985"/>
    <text x="656" y="247" text-anchor="middle" fill="#7dd3fc">Ollama · Qwen 2.5</text>
    <rect x="746" y="226" width="118" height="32" rx="16" fill="#2a1f0b" stroke="#92400e"/>
    <text x="805" y="247" text-anchor="middle" fill="#fbbf24">CUDA GPU</text>
    <rect x="876" y="226" width="112" height="32" rx="16" fill="#241433" stroke="#6b21a8"/>
    <text x="932" y="247" text-anchor="middle" fill="#d8b4fe">Streamlit</text>
    <rect x="1000" y="226" width="126" height="32" rx="16" fill="#1e2630" stroke="#2a323d"/>
    <text x="1063" y="247" text-anchor="middle" fill="#d1d5db">100% local</text>
  </g>
</svg>
